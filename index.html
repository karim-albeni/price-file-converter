<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prisfilskonverterare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%23D10A2F'/></svg>">
<style>
:root{
  /* Rott och svart ar hamtat ur logotypen. Stapeln ar svart, inte rod:
     en rod forloppsindikator ser ut som ett fel. */
  --brand:#D10A2F; --brand-dk:#A70825; --brand-soft:#F9E2E6; --ink:#1A1A1A;
  --slate:#55585A; --mute:#8A8D8F; --line:#D5D7D9; --line-soft:#E7E9EA;
  --paper:#F0F1F2; --card:#FFFFFF; --bar:#1A1A1A;
  --amber:#9A6100; --amber-bg:#FDF4E4;
  --green:#1F6B4A; --green-bg:#E6F0EA;
  --red:#8E1B12; --red-bg:#F7E7E5;
  --display:"Franklin Gothic Medium","Franklin Gothic","Arial Narrow","Segoe UI",sans-serif;
  --body:"Segoe UI",Tahoma,Geneva,sans-serif;
  --mono:Consolas,"Lucida Console","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 72px}

.masthead{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:2px;
  padding:10px 16px;margin:22px 0 24px}
.masthead img{max-height:58px;max-width:260px;display:block}
.masthead:empty{display:none}
.wordmark{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.01em;color:var(--brand)}
h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:500}
.lede{margin:0 0 26px;color:var(--slate)}

#drop{border:2px dashed var(--line);background:var(--card);padding:52px 24px;text-align:center;border-radius:3px}
#drop.hot{border-color:var(--brand);background:var(--brand-soft)}
#drop h2{font-family:var(--display);font-size:25px;font-weight:500;margin:0 0 6px}
#drop p{margin:0 0 20px;color:var(--slate)}

button{font-family:inherit;font-size:15px;cursor:pointer}
.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);padding:11px 26px;font-weight:600;border-radius:2px}
.btn:hover{background:var(--brand-dk);border-color:var(--brand-dk)}
.btn:disabled{background:var(--mute);border-color:var(--mute);cursor:not-allowed}
.btn-lg{padding:15px 40px;font-size:16px;width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px;margin-top:18px}

.job{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.job:first-child{padding-top:0}
.job:last-child{border-bottom:0;padding-bottom:0}
.job-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.job-name{font-weight:600;word-break:break-all}
.job-pct{font-family:var(--mono);font-size:13px;color:var(--slate);white-space:nowrap}
.job-x{background:none;border:0;color:var(--mute);font-size:19px;line-height:1;padding:0 2px}
.job-x:hover{color:var(--red)}
.bar{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;width:0;background:var(--bar);border-radius:4px;transition:width .15s linear}
.bar.done i{background:var(--green)}
.bar.fail i{background:var(--red)}
.job-msg{font-size:13px;color:var(--slate);margin-top:7px}

.note{border-left:4px solid;padding:11px 15px;margin:9px 0;font-size:14px;border-radius:0 2px 2px 0}
.note h3{margin:0 0 3px;font-size:14px;font-weight:700}
.note p{margin:0}
.note.warn{background:var(--amber-bg);border-color:var(--amber);color:#5C3A05}
.note.err{background:var(--red-bg);border-color:var(--red);color:#5E1B12}
.note.ok{background:var(--green-bg);border-color:var(--green);color:#123D2B}
.note.info{background:#EEF2F4;border-color:var(--mute);color:var(--slate)}
.res-file{font-weight:600;margin:16px 0 2px}
.res-file:first-child{margin-top:0}

footer{margin-top:34px;color:var(--mute);font-size:12.5px;text-align:center}
.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:560px){h1{font-size:27px}.lbl{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead" id="masthead"></div>

  <h1>Prisfilskonverterare</h1>
  <p class="lede">Gör om leverantörernas <b>.asc</b>-prisfiler till CSV som affärssystemet kan läsa.
     Filerna behandlas i din egen dator och skickas aldrig någonstans.
     De färdiga CSV-filerna hamnar i mappen <b>Hämtade filer</b>.</p>

  <div id="drop">
    <h2>Dra prisfilerna hit</h2>
    <p>eller välj dem från datorn</p>
    <button class="btn" id="pick">Välj filer…</button>
    <input type="file" id="input" multiple accept=".asc,.ASC" class="hide">
  </div>

  <div id="boot"></div>

  <div class="card hide" id="filesCard">
    <div id="files"></div>
  </div>

  <div class="hide" id="goWrap" style="margin-top:18px">
    <button class="btn btn-lg" id="go">Konvertera</button>
  </div>

  <div class="card hide" id="resultCard">
    <div id="results"></div>
  </div>

  <footer id="foot"></footer>
</div>

    if (d.length !== 6 || !isDigits(d) || d === "000000") return d;

  LAYOUTS.forEach(function(L){
    var pos = 0;
    L.falt.forEach(function(f){
      if (f[0] !== pos) problems.push(L.namn + ": " + f[2] + " börjar på " + f[0] + " men föregående slutar på " + pos);
      if (f[1] <= f[0]) problems.push(L.namn + ": " + f[2] + " har ogiltig längd");
      pos = f[1];
    });
    if (pos !== L.postlangd) problems.push(L.namn + ": fälten täcker " + pos + " tecken, posten är " + L.postlangd);
  });
  return problems;
}
function readSlice(file, from, to){
  return file.slice(from, to).arrayBuffer().then(function(b){ return new Uint8Array(b); });
}
function detectLayout(file){
  var cands = LAYOUTS.filter(function(L){ return file.size > 0 && file.size % (L.postlangd + 2) === 0; });
  if (!cands.length) return Promise.resolve(null);
  var checks = cands.map(function(L){
    var block = L.postlangd + 2;
    var recs = Math.min(200, Math.floor(file.size / block));
    return readSlice(file, 0, recs * block).then(function(buf){
      for (var r = 0; r < recs; r++){
        if (buf[r * block + L.postlangd] !== 13 || buf[r * block + L.postlangd + 1] !== 10) return null;
      }
      return L;
    });
  });
  return Promise.all(checks).then(function(res){
    var ok = res.filter(function(x){ return x; });
    return ok.length === 1 ? ok[0] : null;
  });
}
function convertFile(file, layout, sink, onProgress){
  var width = layout.postlangd, block = width + 2, fields = layout.falt;
  var total = Math.floor(file.size / block);
  var perChunk = Math.max(1, Math.floor((4 * 1024 * 1024) / block));
  var chunkBytes = perChunk * block;
  var rep = { rows:0, total:total, ctrl:0, high:0, zeroBrutto:0, zeroNetto:0, filler:{} };
  var fillerIdx = [], bruttoIdx = -1, nettoIdx = -1;
  fields.forEach(function(f, i){
    if (/^f\d/.test(f[2])) fillerIdx.push(i);
    if (f[2] === "bruttopris") bruttoIdx = i;
    if (f[2] === "nettopris") nettoIdx = i;
  });
  var zeroText = "0.00";
  var offset = 0, lastPaint = 0;
  var header = "﻿" + fields.map(function(f){ return f[2]; }).join(";") + "\r\n";

  function step(){
    if (offset >= file.size) return Promise.resolve(rep);
    var end = Math.min(offset + chunkBytes, file.size);
    return readSlice(file, offset, end).then(function(buf){
      var text = decodeBytes(buf);
      var n = Math.floor(buf.length / block);
      var out = new Array(n);
      for (var r = 0; r < n; r++){
        var base = r * block, lim = base + width, i, b, hasCtrl = false, hasHigh = false;
        for (i = base; i < lim; i++){
          b = buf[i];
          if (b < 32 || b === 127) hasCtrl = true;
          else if (b >= 128 && b < 160) hasHigh = true;
        }
        if (hasCtrl) rep.ctrl++;
        if (hasHigh) rep.high++;
        var vals = new Array(fields.length);
        for (i = 0; i < fields.length; i++){
          var f = fields[i];
          vals[i] = esc(convertValue(text.slice(base + f[0], base + f[1]), f[3]));
        }
        if (bruttoIdx >= 0 && vals[bruttoIdx] === zeroText) rep.zeroBrutto++;
        if (nettoIdx >= 0 && vals[nettoIdx] === zeroText) rep.zeroNetto++;
        for (i = 0; i < fillerIdx.length; i++){
          var fv = vals[fillerIdx[i]];
          if (fv && /[^0\s]/.test(fv)){
            var nm = fields[fillerIdx[i]][2];
            rep.filler[nm] = (rep.filler[nm] || 0) + 1;
          }
        }
        out[r] = vals.join(";");
        rep.rows++;
      }
      return sink.write(out.join("\r\n") + "\r\n").then(function(){
        offset = end;
        var now = Date.now();
        if (now - lastPaint > 90 || offset >= file.size){
          lastPaint = now;
          onProgress(rep.rows, total);
          return new Promise(function(res){ setTimeout(res, 0); }).then(step);
        }
        return step();
      });
    });
  }
  return sink.write(header).then(step);
}
function blobSink(name){
  var parts = [];
  return {
    label: "nedladdad",
    open: function(){ return Promise.resolve(); },
    write: function(s){ parts.push(s); return Promise.resolve(); },
    close: function(){
      var blob = new Blob(parts, { type:"text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 60000);
      parts = null;
      return Promise.resolve();
    }
  };
}

/* ---- gransnitt --------------------------------------------------------- */
var $ = function(id){ return document.getElementById(id); };
function nf(n){ return n.toLocaleString("sv-SE"); }
function fmtSize(b){
  if (b >= 1048576) return (b / 1048576).toFixed(1).replace(".", ",") + " MB";
  return Math.round(b / 1024) + " kB";
}
function csvName(name){ return name.replace(/\.[Aa][Ss][Cc]$/, "") + ".csv"; }
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function note(kind, head, body){
  var n = el("div", "note " + kind);
  if (head) n.appendChild(el("h3", null, head));
  n.appendChild(el("p", null, body));
  return n;
}
function show(id, on){ $(id).className = $(id).className.replace(/ ?hide/, "") + (on ? "" : " hide"); }

var items = [], running = false;

function renderFiles(){
  var host = $("files");
  host.innerHTML = "";
  var any = items.length > 0;
  var anyOk = items.some(function(it){ return it.layout; });
  show("filesCard", any);
  show("goWrap", anyOk);

  items.forEach(function(it, idx){
    var row = el("div", "job");
    var top = el("div", "job-top");
    top.appendChild(el("div", "job-name", it.file.name));

    var right = el("div");
    right.style.display = "flex";
    right.style.alignItems = "center";
    right.style.gap = "10px";
    right.appendChild(el("span", "job-pct", it.layout
      ? (it.pct ? Math.round(it.pct) + " %" : fmtSize(it.file.size))
      : fmtSize(it.file.size)));
    if (!running){
      var x = el("button", "job-x", "×");
      x.title = "Ta bort";
      x.onclick = function(){ items.splice(idx, 1); renderFiles(); };
      right.appendChild(x);
    }
    top.appendChild(right);
    row.appendChild(top);

    if (!it.layout){
      row.appendChild(note("err", "Okänt filformat",
        "Posterna i den här filen är varken 188 eller 350 tecken långa, så kolumnerna kan inte "
        + "delas upp säkert. Filen konverteras inte. Skicka den till din kontaktperson."));
    } else {
      var cls = "bar";
      if (it.state === "klar") cls = "bar done";
      if (it.state === "fel") cls = "bar fail";
      var bar = el("div", cls);
      var fill = el("i");
      fill.style.width = (it.pct || 0) + "%";
      bar.appendChild(fill);
      row.appendChild(bar);
      var msg = el("div", "job-msg", it.msg || (nf(it.records) + " poster · redo"));
      row.appendChild(msg);
      it.bar = bar;
      it.fill = fill;
      it.msgEl = msg;
      it.pctEl = right.firstChild;
    }
    host.appendChild(row);
  });
}

function addFiles(list){
  var arr = Array.prototype.slice.call(list).filter(function(f){
    return !items.some(function(it){ return it.file.name === f.name && it.file.size === f.size; });
  });
  var jobs = arr.map(function(file){
    return detectLayout(file).then(function(L){
      items.push({
        file: file, layout: L,
        records: L ? Math.floor(file.size / (L.postlangd + 2)) : 0,
        pct: 0, msg: null, state: null
      });
    });
  });
  return Promise.all(jobs).then(renderFiles);
}

function run(){
  if (running) return;
  var todo = items.filter(function(it){ return it.layout; });
  if (!todo.length) return;
  running = true;
  $("go").disabled = true;
  $("results").innerHTML = "";
  show("resultCard", true);

  var done = 0;
  todo.forEach(function(it){ it.state = null; it.pct = 0; it.msg = "Väntar"; });
  renderFiles();

  function next(){
    if (!todo.length){
      $("go").disabled = false;
      $("go").textContent = "Konvertera";
      running = false;
      renderFiles();
      return;
    }
    var it = todo.shift();
    var name = csvName(it.file.name);
    var sink = blobSink(name);
    it.state = "kor";
    it.msg = "Konverterar…";
    it.msgEl.textContent = it.msg;
    $("go").textContent = "Konverterar…";

    sink.open().then(function(){
      return convertFile(it.file, it.layout, sink, function(rows, total){
        it.pct = 100 * rows / total;
        it.msg = nf(rows) + " av " + nf(total) + " rader";
        it.fill.style.width = it.pct.toFixed(1) + "%";
        it.msgEl.textContent = it.msg;
        it.pctEl.textContent = Math.round(it.pct) + " %";
      });
    }).then(function(rep){
      return sink.close().then(function(){ return rep; });
    }).then(function(rep){
      it.state = "klar";
      it.pct = 100;
      it.msg = nf(rep.rows) + " rader · " + name + " " + sink.label;
      it.bar.className = "bar done";
      it.fill.style.width = "100%";
      it.msgEl.textContent = it.msg;
      it.pctEl.textContent = "100 %";
      done += rep.rows;

      $("results").appendChild(el("div", "res-file", name));
      if (rep.rows !== rep.total){
        $("results").appendChild(note("err", "Fel antal rader",
          "Skrev " + nf(rep.rows) + " rader men filen innehåller " + nf(rep.total)
          + " poster. Använd inte den här filen — hör av dig."));
      } else {
        $("results").appendChild(note("ok", null, nf(rep.rows) + " rader skrivna. Alla poster kom med."));
      }
      if (rep.zeroBrutto || rep.zeroNetto){
        $("results").appendChild(note("warn", "Kontrollera innan import",
          nf(rep.zeroBrutto) + " rader saknar bruttopris och " + nf(rep.zeroNetto)
          + " saknar nettopris (0.00). Om affärssystemet tolkar noll "
          + "som ett riktigt pris skrivs befintliga priser över. Filtrera bort dem vid importen."));
      }
      if (rep.ctrl){
        $("results").appendChild(note("info", null,
          nf(rep.ctrl) + " poster innehåller radbrytningar mitt i texten — de är trasiga hos "
          + "leverantören. Posterna kom med och alla fält utom benämningen är rätt."));
      }
      if (rep.high){
        $("results").appendChild(note("info", null,
          nf(rep.high) + " poster innehåller specialtecken, till exempel tumtecken i "
          + "benämningar som 1/2”. De har tolkats som Windows-1252."));
      }
      var fk = Object.keys(rep.filler);
      if (fk.length){
        $("results").appendChild(note("warn", "Oväntat innehåll i tomma fält",
          "Fälten " + fk.join(", ") + " brukar vara tomma men innehåller data i den här filen. "
          + "Fältindelningen kan behöva ses över."));
      }
      next();
    })["catch"](function(e){
      it.state = "fel";
      it.msg = "Misslyckades";
      it.bar.className = "bar fail";
      it.msgEl.textContent = it.msg;
      $("results").appendChild(note("err", "Filen kunde inte konverteras: " + it.file.name,
        String(e && e.message ? e.message : e)));
      next();
    });
  }
  next();
}

(function init(){
  /* foretagsprofil */
  var root = document.documentElement;
  if (root && root.style && root.style.setProperty){
    root.style.setProperty("--brand", BRAND.primar);
    root.style.setProperty("--brand-dk", BRAND.morker);
    root.style.setProperty("--brand-soft", BRAND.ljus);
  }
  var mh = $("masthead");
  if (BRAND.logotyp){
    var img = document.createElement("img");
    img.src = BRAND.logotyp;
    img.alt = BRAND.foretag || "";
    mh.appendChild(img);
  }
  if (BRAND.foretag){
    if (!BRAND.logotyp) mh.appendChild(el("span", "wordmark", BRAND.foretag));
    document.title = BRAND.foretag + " — Prisfilskonverterare";
    $("foot").textContent = BRAND.foretag;
  }

  var probs = validateLayouts();
  if (probs.length){
    $("boot").appendChild(note("err", "Fältindelningen är felaktig", probs.join(" · ")));
    $("pick").disabled = true;
    return;
  }

  $("pick").onclick = function(){ $("input").click(); };
  $("input").onchange = function(e){ addFiles(e.target.files); e.target.value = ""; };
  $("go").onclick = run;

  var dz = $("drop");
  ["dragenter", "dragover"].forEach(function(t){
    dz.addEventListener(t, function(e){ e.preventDefault(); dz.className = "hot"; });
  });
  ["dragleave", "drop"].forEach(function(t){
    dz.addEventListener(t, function(e){ e.preventDefault(); dz.className = ""; });
  });
  dz.addEventListener("drop", function(e){
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("drop", function(e){ e.preventDefault(); });
})();
</script>
</body>
